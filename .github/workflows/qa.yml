name: QA

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system linters
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck yamllint

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Markdownlint
        run: npm install --global markdownlint-cli

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Rust and Taplo
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Taplo
        run: cargo install taplo-cli --locked

      - name: Install Caddy
        run: |
          curl --fail --silent --show-error --location \
            https://dl.cloudsmith.io/public/caddy/stable/setup.deb.sh | sudo -E bash
          sudo apt-get install -y caddy

      - name: Run static QA
        run: qa/lint.sh

      - name: Verify provisioning and API isolation
        run: |
          bash tests/test-provision-config.sh
          bash tests/test-server-api-config.sh

  publish-release:
    name: Publish validated release
    needs: static-analysis
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already published"
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "Server Setup $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
