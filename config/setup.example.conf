# =============================================================================
# Server Setup - Configuration non sensible
# =============================================================================

# -----------------------------------------------------------------------------
# APT
# -----------------------------------------------------------------------------

# Temps maximal d'attente lorsqu'une opération APT est déjà en cours.
APT_WAIT_TIMEOUT="600"
APT_WAIT_INTERVAL="5"

# -----------------------------------------------------------------------------
# Sécurité
# -----------------------------------------------------------------------------

ADMIN_USER="user"
SSH_PORT="22"

# Fermeture de l'ancien port après changement SSH.
CLOSE_OLD_SSH_PORT="false"

# La suppression du compte provider reste recommandée via security-deluser.
DELETE_INITIAL_USER="false"
INITIAL_USER="ubuntu"

# -----------------------------------------------------------------------------
# Docker
# -----------------------------------------------------------------------------

DOCKER_ADMIN_USER="user"
GHCR_ENABLED="false"

# -----------------------------------------------------------------------------
# Reverse proxy
# -----------------------------------------------------------------------------
#
# Pour le mode unattended multi-app, il est préférable d'utiliser des fichiers
# dédiés par application plutôt que d'essayer d'encoder des tableaux Bash ici.
#
# Exemple futur :
# APPLICATION_CONFIG_DIR="/etc/server-setup/apps.d"
CADDY_MIGRATION_CONFIRM="true"

# -----------------------------------------------------------------------------
# Backups
# -----------------------------------------------------------------------------

RCLONE_REMOTE="backup"
RCLONE_KEEP_EXISTING="true"

DB_BACKUP_ENABLED="false"
FILES_BACKUP_ENABLED="true"
PROVIDER_BACKUP_ENABLED="false"

REMOTE_ROOT="servers/vps-production"
LOCAL_RETENTION_DAYS="3"
REMOTE_RETENTION_DAYS="30"

DB_SCHEDULE="*-*-* 02,08,14,20:15:00"
FILES_SCHEDULE="*-*-* 03:00:00"
PROVIDER_SCHEDULE="Sun *-*-* 04:00:00"

SNAPSHOT_MODE="logical"
PROVIDER_NAME="none"
OVH_KEEP_EXISTING="true"
OVH_ENDPOINT="ovh-eu"

# -----------------------------------------------------------------------------
# Maintenance
# -----------------------------------------------------------------------------

REBOOT_SCHEDULE="Sun *-*-* 05:00:00"
