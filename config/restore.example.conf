# Configuration de restauration unattended.

# 1 = PostgreSQL, 2 = snapshot fichiers, 3 = release Docker, 4 = DR.
RESTORE_ACTION="3"

RESTORE_RELEASE_BACKUP="remote:20260820T030000Z"
RESTORE_APP="app1"
RESTORE_COMPOSE_FILE="compose.yaml"
RESTORE_RELEASE_CONFIRM="true"

